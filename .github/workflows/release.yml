name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check version tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"

          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Tag '$env:RELEASE_TAG' does not match package version '$expectedTag'."
          }

      - name: Install dependencies
        run: npm ci

      - name: Build portable package
        run: npm run dist:portable

      - name: Create checksum
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem release -Filter "*.zip" -File)

          if ($archives.Count -eq 0) {
            throw "No portable ZIP was produced."
          }

          $checksums = $archives |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }

          Set-Content release/SHA256SUMS.txt -Value $checksums -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(
            Get-ChildItem release -Filter "*.zip" -File |
              Sort-Object Name |
              ForEach-Object FullName
          )
          $assets += (Resolve-Path release/SHA256SUMS.txt).Path

          gh release view $env:RELEASE_TAG 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $assets --clobber
          } else {
            gh release create $env:RELEASE_TAG $assets `
              --verify-tag `
              --generate-notes `
              --title "OpenGMS $env:RELEASE_TAG"
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
